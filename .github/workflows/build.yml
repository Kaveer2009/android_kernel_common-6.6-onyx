name: Build ONYX GKI Kernel (KernelSU-Next + SuSFS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set environment (ONYX)
        run: |
          echo "ANDROID_VERSION=android14" >> $GITHUB_ENV
          echo "KERNEL_VERSION=6.6" >> $GITHUB_ENV
          echo "SUB_LEVEL=auto" >> $GITHUB_ENV
          echo "OS_PATCH_LEVEL=2025-06" >> $GITHUB_ENV
          echo "DATE=$(TZ=Asia/Kolkata date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "ARTIFACT=$GITHUB_WORKSPACE/artifact" >> $GITHUB_ENV

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Build kernel (ONYX)
        run: |
          mkdir -p $ARTIFACT
          ./build.sh \
            $ANDROID_VERSION \
            $KERNEL_VERSION \
            $SUB_LEVEL \
            $OS_PATCH_LEVEL \
            $DATE \
            $ARTIFACT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-onyx-gki
          path: ${{ env.ARTIFACT }}/*

  create_release:
    needs: build_kernel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Set release tag
        run: |
          TAG="onyx-$(TZ=Asia/Kolkata date +%Y%m%d%H%M)"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create Git tag
        run: |
          git tag -a "$TAG" -m "ONYX GKI 6.6 • KernelSU-Next + SuSFS"
          git push origin "$TAG"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: "ONYX GKI Kernel (KernelSU-Next + SuSFS)"
          body: |
            • Device: POCO F7 (onyx)
            • Kernel: GKI 6.6
            • Root: KernelSU-Next
            • Filesystem: SuSFS
            • No Samsung hacks
            • Safe GKI build
          files: artifact/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
