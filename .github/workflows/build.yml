name: Build ONYX GKI Kernel (Android 15 & 16)

on:
  push:
    branches: [ KernelSU-Next ]
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_version: android15
            os_patch_level: 2025-06
          - android_version: android16
            os_patch_level: 2025-09

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set environment (ONYX)
        run: |
          echo "ANDROID_VERSION=${{ matrix.android_version }}" >> $GITHUB_ENV
          echo "KERNEL_VERSION=6.6" >> $GITHUB_ENV
          echo "SUB_LEVEL=auto" >> $GITHUB_ENV
          echo "OS_PATCH_LEVEL=${{ matrix.os_patch_level }}" >> $GITHUB_ENV
          echo "DATE=$(TZ=Asia/Kolkata date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "ARTIFACT=$GITHUB_WORKSPACE/artifact" >> $GITHUB_ENV

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Build kernel
        run: |
          mkdir -p $ARTIFACT
          ./build.sh \
            $ANDROID_VERSION \
            $KERNEL_VERSION \
            $SUB_LEVEL \
            $OS_PATCH_LEVEL \
            $DATE \
            $ARTIFACT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-onyx-${{ matrix.android_version }}
          path: ${{ env.ARTIFACT }}/*

  create_release:
    needs: build_kernel
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

      - name: Set release tag
        run: |
          TAG="onyx-gki-$(TZ=Asia/Kolkata date +%Y%m%d%H%M)"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Create tag
        run: |
          git tag -a "$TAG" -m "ONYX GKI 6.6 • Android 15 & 16 • KernelSU-Next + SuSFS"
          git push origin "$TAG"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG }}
          name: "ONYX GKI Kernel (Android 15 & 16)"
          body: |
            Device: POCO F7 (onyx)
            Kernel: GKI 6.6
            Android: 15 & 16
            Root: KernelSU-Next
            FS: SuSFS
            Notes:
            • No Samsung patches
            • Safe for GKI-based ROMs
            • Flash only matching Android version
          files: artifact/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

